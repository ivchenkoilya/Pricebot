<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#071125" />
    <title>Clarify</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
      html,body,#root{margin:0;min-height:100%;background:#071125;color:#f7fbff;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .boot{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;background:radial-gradient(circle at 50% 0,rgba(38,126,255,.22),transparent 38%),#071125}
      .boot-card{width:min(100%,420px);padding:22px;border:1px solid rgba(133,194,255,.18);border-radius:24px;background:rgba(17,32,59,.78);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.25)}
      .boot-orb{width:34px;height:34px;margin:0 auto 14px;border:3px solid rgba(95,210,255,.2);border-top-color:#55d8ff;border-radius:50%;animation:spin .9s linear infinite}
      .boot-card b{display:block;font-size:20px;margin-bottom:7px}.boot-card span{color:#8fa4c5;font-size:13px;line-height:1.5}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" id="clarify-boot">
        <div class="boot-card"><div class="boot-orb"></div><b>Clarify</b><span>Открываю Mini App…</span></div>
      </div>
    </div>
    <script>
      window.addEventListener('error', function () {
        var boot = document.getElementById('clarify-boot');
        if (boot) boot.querySelector('span').textContent = 'Не удалось загрузить интерфейс. Закрой Mini App и открой его ещё раз.';
      });
      window.addEventListener('unhandledrejection', function () {
        var boot = document.getElementById('clarify-boot');
        if (boot) boot.querySelector('span').textContent = 'Не удалось подключиться к Clarify. Попробуй открыть Mini App ещё раз.';
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
